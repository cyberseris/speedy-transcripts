version: 0.2
# Cowork courier: the sandbox cannot reach S3, so CodeBuild downloads the
# Lambda deps and uploads both zips itself. Every command is quoted because
# pip's --only-binary=:all: contains a colon-space that YAML would otherwise
# read as a key/value separator.
phases:
  build:
    commands:
      - "pip download --platform manylinux2014_x86_64 --only-binary=:all: --target python supabase boto3"
      - "zip -rq deps-layer.zip python"
      - "aws s3 cp deps-layer.zip s3://${ARTIFACTS_BUCKET}/deps-layer.zip"
      - "zip -j -q handler.zip worker/lambda_distributor.py"
      - "aws s3 cp handler.zip s3://${ARTIFACTS_BUCKET}/handler.zip"
